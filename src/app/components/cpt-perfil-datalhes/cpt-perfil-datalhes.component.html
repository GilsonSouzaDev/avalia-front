<section class="perfil-card">
  <div class="perfil-card-glow"></div>
  
  <div class="perfil-card-header">
    <div class="avatar-placeholder">
      <mat-icon>person</mat-icon>
    </div>
    <div class="user-info">
      <span class="badge-role">{{ professor.perfilProfessor }}</span>
      <h2 class="user-name">{{ professor.nome }}</h2>
      <div class="user-email">
        <mat-icon>mail_outline</mat-icon>
        <span>{{ professor.email }}</span>
      </div>
    </div>
  </div>

  <div class="perfil-card-body">
    <div class="info-section">
      <h3 class="section-title">
        <mat-icon>menu_book</mat-icon>
        Disciplinas
      </h3>
      <div class="disciplinas-tags">
        @for (disciplina of professor.disciplinas; track $index) {
          <span class="tag">{{ disciplina.nome }}</span>
        } @empty {
          <span class="tag-empty">Nenhuma disciplina vinculada</span>
        }
      </div>
    </div>
  </div>

  <div class="perfil-card-footer">
    <ng-content></ng-content>
  </div>
</section>
